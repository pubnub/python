name: Docs snippets

# Live tests of the Python and asyncio docs code samples (docs-snippets/README.md). Separate from run-tests.yml on
# purpose: this suite calls the real PubNub service and is never part of the unit and integration tests.
#
# No workflow-level paths filter: a required check behind a paths filter stays pending. The `changes` job decides
# instead, and the `gate` job is the one to require in branch protection.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    name: Relevant changes
    runs-on:
      group: organization/Default
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      live: ${{ steps.diff.outputs.live }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide with git diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          changed=false
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            changed=true
          else
            base="$PR_BASE"
            [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              changed=true
            elif git diff --name-only "$base" HEAD | grep -qE '^(docs-snippets/|pubnub/|setup\.py$|requirements-dev\.txt$|\.github/workflows/docs-snippets\.yml$)'; then
              changed=true
            fi
          fi
          live=$changed
          if [ "$FORK" = "true" ]; then
            live=false
            [ "$changed" = "true" ] && echo "live shards skipped: fork PR without secrets" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "relevant changes: $changed, live shards: $live"

  dry:
    name: Dry run and manifest (Python ${{ matrix.python }})
    needs: [changes]
    if: needs.changes.outputs.changed == 'true'
    runs-on:
      group: organization/Default
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: ./scripts/install.sh
      - name: Dry run (no network) with compile, selftest, marker lint, manifest and reporter self-test
        working-directory: docs-snippets
        run: python -u -m harness.cli dry

  live:
    name: Live shards (open, pam)
    needs: [changes, dry]
    if: needs.changes.outputs.live == 'true'
    runs-on:
      group: organization/Default
    # The shards run one after another in this one job, never in parallel. The pam shard opens its keyset with an
    # application-level grant for a moment, and the janitor's revoke would break a shard running beside it.
    timeout-minutes: 30
    # One live job at a time across the repository, so two workflow runs never share the keysets. A newer waiting run
    # replaces an older waiting one, a running one is never cancelled.
    concurrency:
      group: docs-snippets-live
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No secret is set on the job or on this step, so installing dependencies never sees a key.
      - name: Install dependencies
        run: ./scripts/install.sh
      # Each shard runs even when an earlier shard failed, but not after a cancel. Keys are set on the shard steps only.
      - name: Shard open
        id: open
        if: '!cancelled()'
        working-directory: docs-snippets
        env:
          SUBSCRIBE_KEY: ${{ secrets.SDK_DOCS_OPEN_SUBSCRIBE_KEY }}
          PUBLISH_KEY: ${{ secrets.SDK_DOCS_OPEN_PUBLISH_KEY }}
          DOCS_SNIPPETS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-open
        run: python -u -m harness.cli run --shard open
      - name: Shard pam
        id: pam
        if: '!cancelled()'
        working-directory: docs-snippets
        env:
          SUBSCRIBE_KEY: ${{ secrets.SDK_DOCS_OPEN_SUBSCRIBE_KEY }}
          PUBLISH_KEY: ${{ secrets.SDK_DOCS_OPEN_PUBLISH_KEY }}
          PAM_SUBSCRIBE_KEY: ${{ secrets.SDK_DOCS_PAM_SUBSCRIBE_KEY }}
          PAM_PUBLISH_KEY: ${{ secrets.SDK_DOCS_PAM_PUBLISH_KEY }}
          PAM_SECRET_KEY: ${{ secrets.SDK_DOCS_PAM_SECRET_KEY }}
          DOCS_SNIPPETS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-pam
        run: python -u -m harness.cli run --shard pam
      # After a failure or a cancel: revoke the application-level grants and remove leftovers.
      - name: Revoke grants and clean up
        if: cancelled() || failure()
        working-directory: docs-snippets
        env:
          SUBSCRIBE_KEY: ${{ secrets.SDK_DOCS_OPEN_SUBSCRIBE_KEY }}
          PUBLISH_KEY: ${{ secrets.SDK_DOCS_OPEN_PUBLISH_KEY }}
          PAM_SUBSCRIBE_KEY: ${{ secrets.SDK_DOCS_PAM_SUBSCRIBE_KEY }}
          PAM_PUBLISH_KEY: ${{ secrets.SDK_DOCS_PAM_PUBLISH_KEY }}
          PAM_SECRET_KEY: ${{ secrets.SDK_DOCS_PAM_SECRET_KEY }}
        run: python -u -m harness.cli janitor
      - name: Show the result per run
        if: always()
        run: cat docs-snippets/report/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-snippets-reports
          path: docs-snippets/report/
          if-no-files-found: warn

  gate:
    name: Docs snippets
    if: always()
    needs: [changes, dry, live]
    runs-on:
      group: organization/Default
    steps:
      - name: Decide
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.dry.result }} ${{ needs.live.result }}
          CHANGED: ${{ needs.changes.outputs.changed }}
        run: |
          echo "changes, dry, live: $RESULTS (relevant changes: $CHANGED)"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "a needed job ended with $result"
              exit 1
            fi
          done
          echo "docs snippets gate passed"
