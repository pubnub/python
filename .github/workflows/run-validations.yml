name: Validations

on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint project
    runs-on:
      group: organization/Default
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip3 install --user "ruff>=0.8"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format (files changed vs. base branch)
        # The legacy codebase is not yet ruff-formatted; enforce formatting on touched files only.
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin master && base=FETCH_HEAD
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.py' '*.pyi')
          if [ -n "$files" ]; then echo "$files" | xargs ruff format --check --diff; fi
      - name: Cancel workflow runs for commit on error
        if: failure()
        uses: ./.github/.release/actions/actions/utils/fast-jobs-failure
  pubnub-yml:
    name: "Validate .pubnub.yml"
    runs-on:
      group: organization/Default
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Checkout validator action
        uses: actions/checkout@v4
        with:
          repository: pubnub/client-engineering-deployment-tools
          ref: v1
          token: ${{ secrets.GH_TOKEN }}
          path: .github/.release/actions
      - name: "Run '.pubnub.yml' file validation"
        uses: ./.github/.release/actions/actions/validators/pubnub-yml
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Cancel workflow runs for commit on error
        if: failure()
        uses: ./.github/.release/actions/actions/utils/fast-jobs-failure
  all-validations:
    name: Validations
    needs: [pubnub-yml, lint]
    runs-on:
      group: organization/Default
    steps:
      - name: Validations summary
        run: echo -e "\033[38;2;95;215;0m\033[1mAll validations passed"
