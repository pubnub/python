[pytest]
# Own config so that "py.test tests" at the repository root never collects this folder.
python_files = *.py
python_functions = test_*
testpaths = sync asyncio
addopts = --import-mode=importlib -p no:cacheprovider -p no:randomly
asyncio_mode = auto
log_level = INFO
asyncio_default_fixture_loop_scope = function
markers =
    open: steps that need the open keyset role
    pam: steps that need the Access Manager keyset role
filterwarnings =
    ignore:Mutable config will be deprecated in the future.:DeprecationWarning
    ignore:Access management v2 is being deprecated.:DeprecationWarning
    ignore:.*Usage of local cipher_keys is discouraged.*:UserWarning
