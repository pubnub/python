line-length = 120
extend-exclude = ["scripts", "src", "tests", ".cache", ".idea", ".tox", "venv"]

[lint]
# preview enables pycodestyle E1/E2/E3 (indentation, whitespace, blank lines), which flake8 checked
preview = true
select = ["E", "F", "W"]
ignore = [
    "E402",  # module-level import not at top (was ignored in flake8 config)
    "F811",  # redefinition of unused name (was ignored in CI flake8 invocation)
]
