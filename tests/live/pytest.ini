[pytest]
# Own config of the live tier (README.md). The root run (py.test tests) never collects this folder: tests/conftest.py
# has collect_ignore = ["live"] and scripts/run-tests.py passes --ignore=tests/live/.
#   python -u -m pytest -c tests/live/pytest.ini
python_files = test_*.py
python_functions = test_*
testpaths = sync asyncio
pythonpath = .
addopts = --import-mode=importlib -p no:cacheprovider -p no:randomly --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_level = INFO
# Per-test timeout (pytest-timeout), 120 s for every test by default. Tests that need more carry
# @pytest.mark.timeout(n).
timeout = 120
filterwarnings =
    ignore:Mutable config will be deprecated in the future.:DeprecationWarning
    ignore:Access management v2 is being deprecated.:DeprecationWarning
    ignore:.*Usage of local cipher_keys is discouraged.*:UserWarning
